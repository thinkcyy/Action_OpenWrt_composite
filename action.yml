name: 'Action_OpenWrt_composite'
description: 'Action'
inputs:
  ROUTER_MODEL:  
    description: 'MODEL'
    required: true
    default: 'AX6'
  RELEASE_NAME_PREFIX:  
    description: 'MODEL'
    required: false
runs:
  using: "composite"
  steps:                   
    - name: Organize files         
      working-directory: ${{ github.workspace }}/runner_root/openwrt
      shell: bash
      run: |      
          echo '当前执行步骤：11-打标'
          # tag_name=$([[ "${{ env.COMPILE_CONFIG_DIFF }}" != 'n' ]] && echo ${{ env.COMPILE_CONFIG_DIFF }} || echo ${{ env.COMPILE_CONFIG_BASE}})
          # echo $tag_name
          # tag_name=$([[ "${{ env.COMPILE_CONFIG }}" != 'n' ]] && echo ${{ env.COMPILE_CONFIG}} || echo $tag_name)
          # echo $tag_name
          tag_name="${{ env.REPO_TAG }}"
          # echo $tag_name
          # [[ "${{ env.IMAGEBUILDER }}" = 'y' ]] && tag_name=ImageBuilder-"$tag_name"
          # echo $tag_name
          # [[ "${{ env.FILES_CONFIG }}" != 'public' ]] && tag_name="$tag_name".${{ env.FILES_CONFIG }}
          # echo $tag_name          

          cd ./bin

          K=$(find -type f -name "kernel*" )
          K1=${K##*/}
          K2=${K1:7}
          [[ $K2 =~ \~ ]] && KERNEL=${K2%%~*} || KERNEL=${K2%%-*}
          # KERNEL=$(echo $K2 | cut -d '~' -f1) || KERNEL=$(echo $K2 | cut -d '~' -f1)
          echo $KERNEL
          echo "KERNEL=$KERNEL" >> $GITHUB_ENV
          tag_name="$tag_name"-"("$(date +%Y%m%d-%H%M)")"-$KERNEL-${{ env.COMMITHASH }}
          echo $tag_name

          # 为文件名准备的删除非标字符tag
          TAG_NAME_F=${tag_name//\(/}
          TAG_NAME_F=${TAG_NAME_F//\)/}
          echo $TAG_NAME_F
          
          echo "TAG_NAME="$tag_name"" >> $GITHUB_ENV  
          echo "TAG_NAME_F="$TAG_NAME_F"" >> $GITHUB_ENV  

          RELEASE_NAME=${{ env.TAG_NAME }}
          echo Release名称为：$RELEASE_NAME
          [[ ! -z "${{ env.TAG_PREFIX }}" ]] && RELEASE_NAME=${{ env.TAG_PREFIX }}-${{ env.TAG_NAME }}
          echo Release名称为：$RELEASE_NAME
          echo "RELEASE_NAME="$RELEASE_NAME"" >> $GITHUB_ENV
          echo ${{ env.TRELEASE_NAME }}

    - name: Organize files
      shell: bash
      run: |                             
          set +e
          echo '当前执行步骤：12-组织产出文件'          
          cd ./runner_root
          echo "targets产出文件："
          tree  ./openwrt/bin/
          rm -rf ./artifact/
          mkdir -p ./artifact/

          echo '当前执行步骤：12.1-组织配置文件：'
          cp -rf $(find ./openwrt/bin/targets/ -type f -name "*.buildinfo") ./artifact/
          cp -rf $(find ./openwrt/bin/targets/ -type f -name "*.manifest") ./artifact/
          cp -r ./openwrt/.config ./artifact/"defconfig-${{ env.TAG_NAME_F }}.config"
          cp -rf $(find ./openwrt/bin/ -type f -name "kernel-*") ./artifact/
          

          echo '当前执行步骤：12.2-组织bin文件：'
          echo '-sysupgrade文件：'
          rename 's/sysupgrade.bin/sysupgrade-${{ env.TAG_NAME_F }}.bin/' *
          cp -vrf $(find ./openwrt/bin/targets/ -type f -name "*sysupgrade*") ./artifact/
          
          
          echo '当前执行步骤：12.3-组织tar文件：'
          if [ "${{ env.IMAGEBUILDER }}" = 'y' ] ; then             
             cp -rf $(find ./openwrt/bin/targets/ -type f -name "*imagebuilder*") ./artifact/
             cd ./artifact/
             rename 's/.tar.xz/-${{ env.TAG_NAME_F }}.tar.xz/' *
             rename 's/.tar.zst/-${{ env.TAG_NAME_F }}.tar.zst/' *
          fi

          echo '-产出文件总览：'
          ls -hl 
          set -e
          
    - name: Upload artifact
      uses: actions/upload-artifact@main
      with:
        name: "${{ env.REPO_TYPE }}-${{ env.TAG_NAME }}"
        path: ./runner_root/artifact/
        
    - name: Addtional bin for release      
      shell: bash
      run: |          
          echo '当前执行步骤：13-添加额外发布文件'    
          set +e
             cd ./runner_root
             cp -vrf $(find ./openwrt/bin/targets/ -type f -name "*sdk*") ./artifact/
             cp -vrf $(find ./openwrt/bin/targets/ -type f -name "*toolchain*") ./artifact/
          set -e
