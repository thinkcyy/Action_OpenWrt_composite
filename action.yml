name: 'Action_OpenWrt_composite'
description: 'Action'
inputs:
  CONFIG_VERIFIED:  
    required: false

  CONFIG_TO_ADD:  
    required: false

  CONFIG_TO_DEL:  
    required: false

runs:
  using: "composite"
  steps:
    - name: PrepareSource      
      shell: bash
      env:
        CONFIG_VERIFIED: ${{ inputs.CONFIG_VERIFIED }}
        CONFIG_TO_ADD: ${{ inputs.CONFIG_TO_ADD }}
        CONFIG_TO_DEL: ${{ inputs.CONFIG_TO_DEL }}
      run:  |
          #cat $(readlink -f $0)
          cd runner_root/openwrt
          
          if [[ ! -z ${CONFIG_VERIFIED} ]]; then
            for config in $CONFIG_VERIFIED
            do
              echo 添加$config
              echo $config >> ./.config
            done
          fi
          
          if [[ ! -z ${CONFIG_TO_ADD}  ]] ; then
            for config in $CONFIG_TO_ADD
            do 
              echo 添加$config
              #sed -i '$a'"${config}"'\n' ./.config
              echo $config >> ./.config
            done
          fi

          if [[ ! -z ${CONFIG_TO_DEL} ]] ; then
            for config in $CONFIG_TO_DEL
            do
              echo 添加$config
              #sed -i '$a'"${config}"'\n' ./.config
              echo $config >> ./.config
            done
          fi

          make defconfig

