name: 'Action_OpenWrt_composite'
description: 'Action'
inputs:
  CONFIG_VERIFIED:  
    required: false
    default: 'n'
  CONFIG_TO_ADD:  
    required: false
    default: 'n'
  CONFIG_TO_DEL:  
    required: false
    default: 'n'
runs:
  using: "composite"
  steps:
    - name: PrepareSource      
      shell: bash
      env:
        CONFIG_VERIFIED: ${{ inputs.CONFIG_VERIFIED }}
        CONFIG_TO_ADD: ${{ inputs.CONFIG_TO_ADD }}
        CONFIG_TO_DEL: ${{ inputs.CONFIG_TO_DEL }}
      run:  |
          cat $(readlink -f $0)
          cd runner_root/openwrt
          echo $CONFIG_VERIFIED
          echo $CONFIG_TO_ADD
          echo $CONFIG_TO_DEL
          
          if [[ ! ${CONFIG_VERIFIED} = "n" ]]; then
          echo $CONFIG_VERIFIED
            for config in "$CONFIG_VERIFIED"
            do
              echo 添加$config
              echo $config >> ./.config
            done
          fi
          
          if [ ! -z "${CONFIG_TO_ADD}"  ] ; then
          echo $CONFIG_TO_ADD
            for config in $CONFIG_TO_ADD
            do ${CONFIG_TO_ADD}
              echo 添加$config
              #sed -i '$a'"${config}"'\n' ./.config
              echo $config >> ./.config
            done
          fi

          if [ ! -z "${CONFIG_TO_DEL}" ] ; then
          echo $CONFIG_TO_DEL
            for config in $CONFIG_TO_DEL
            do
              echo 添加$config
              #sed -i '$a'"${config}"'\n' ./.config
              echo $config >> ./.config
            done
          fi

          tail -n 10 ./.config
